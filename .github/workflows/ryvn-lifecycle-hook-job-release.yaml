name: Build & Release lifecycle-hook-job

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "services/lifecycle-hook-job/**"
      - ".github/workflows/ryvn-lifecycle-hook-job-release.yaml"
  pull_request:
    paths:
      - "services/lifecycle-hook-job/**"
      - ".github/workflows/ryvn-lifecycle-hook-job-release.yaml"

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      SERVICE_NAME: lifecycle-hook-job
      RYVN_API_URL: ${{ vars.RYVN_API_URL }}
      RYVN_AUTH_URL: ${{ vars.RYVN_AUTH_URL }}
      RYVN_PROJECT_ID: ${{ vars.RYVN_PROJECT_ID }}
      RYVN_ORG_ID: ${{ vars.RYVN_ORG_ID }}
      HAS_BUILD_SECRETS: ${{ secrets.BUILD_SECRETS != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ryvn CLI
        uses: ryvn-technologies/install-ryvn-cli@v1.0.0

      - name: Get Service Info
        id: service-info
        env:
          RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
          RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
        run: |
          service_json=$(ryvn get service "${SERVICE_NAME}" -o json)
          service_type=$(echo "$service_json" | jq -r '.definition.type')
          echo "service_type=$service_type" >> "$GITHUB_OUTPUT"

          if [ "$service_type" = "terraform.v1" ]; then
            tag_prefix=$(echo "$service_json" | jq -r '.definition.source.tagPrefix // ""')
          else
            tag_prefix="${SERVICE_NAME}@"
          fi
          echo "tag_prefix=$tag_prefix" >> "$GITHUB_OUTPUT"

          if [ "$service_type" = "web-server.v1" ] || [ "$service_type" = "job.v1" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$service_type" = "helm-chart.v1" ]; then
            chart_repo=$(echo "$service_json" | jq -r '.definition.chartRepository // ""')
            if [ -n "$chart_repo" ] && [ "$chart_repo" != "null" ]; then
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::helm-chart.v1 service is missing required chartRepository configuration"
              exit 1
            fi
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Tag
        id: generate-tag
        env:
          RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
          RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
        run: |
          tag_info=$(ryvn generate-release-tag "${SERVICE_NAME}" --prefix="${{ steps.service-info.outputs.tag_prefix }}" -o json --default-bump-minor)

          version=$(echo "$tag_info" | jq -r '.version')
          new_tag=$(echo "$tag_info" | jq -r '.tag')
          channel=$(echo "$tag_info" | jq -r '.channel')
          should_release=$(echo "$tag_info" | jq -r '.shouldRelease')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Set build environment
        if: env.HAS_BUILD_SECRETS == 'true' && steps.service-info.outputs.needs_build == 'true'
        run: echo "$BUILD_SECRETS" >> "$GITHUB_ENV"
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}

      - name: Build and Push
        id: build
        if: steps.service-info.outputs.needs_build == 'true'
        uses: ryvn-technologies/ryvn-build-action@v2
        with:
          service_name: ${{ env.SERVICE_NAME }}
          version: ${{ steps.generate-tag.outputs.version }}
          build_only: ${{ steps.generate-tag.outputs.channel == '' }}
          ryvn_client_id: ${{ secrets.RYVN_CLIENT_ID }}
          ryvn_client_secret: ${{ secrets.RYVN_CLIENT_SECRET }}
          ryvn_api_url: ${{ env.RYVN_API_URL }}
          ryvn_auth_url: ${{ env.RYVN_AUTH_URL }}
          ryvn_project_id: ${{ env.RYVN_PROJECT_ID }}
          build_secrets: ${{ secrets.BUILD_SECRETS }}

      - name: Create Ryvn Release
        if: |
          steps.generate-tag.outputs.channel != '' &&
          !contains(github.event.head_commit.message, '[skip-release]') &&
          !contains(github.event.pull_request.title, '[skip-release]')
        env:
          RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
          RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
          BUILD_ARTIFACTS: ${{ steps.build.outputs.build_artifacts }}
        run: |
          version="${{ steps.generate-tag.outputs.new_tag }}"
          version=${version#${{ steps.service-info.outputs.tag_prefix }}}
          version=${version#@}
          channel="${{ steps.generate-tag.outputs.channel }}"
          artifact_args=()
          if [ -n "$BUILD_ARTIFACTS" ] && [ "$BUILD_ARTIFACTS" != "[]" ]; then
            artifacts_file="${RUNNER_TEMP}/ryvn-build-artifacts.json"
            printf '%s\n' "$BUILD_ARTIFACTS" > "$artifacts_file"
            if ryvn create release --help 2>&1 | grep -q -- '--artifacts-file'; then
              artifact_args+=(--artifacts-file "$artifacts_file")
            else
              echo "::warning::installed Ryvn CLI does not support --artifacts-file; creating release without build artifact metadata"
            fi
          fi

          ryvn create release "${SERVICE_NAME}" "$version" --channel "$channel" "${artifact_args[@]}"

      - name: Create GitHub Tag
        if: |
          steps.generate-tag.outputs.should_release == 'true' &&
          !contains(github.event.head_commit.message, '[skip-release]') &&
          !contains(github.event.pull_request.title, '[skip-release]')
        run: |
          new_tag="${{ steps.generate-tag.outputs.new_tag }}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag "$new_tag"
          git push origin "$new_tag"

      - name: Create GitHub Release
        if: |
          steps.generate-tag.outputs.should_release == 'true' &&
          !contains(github.event.head_commit.message, '[skip-release]') &&
          !contains(github.event.pull_request.title, '[skip-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate-tag.outputs.new_tag }}
          name: ${{ steps.generate-tag.outputs.new_tag }}
          generate_release_notes: false
          draft: false
          prerelease: false
